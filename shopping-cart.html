<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winkelwagen - Pakken &amp; Loafers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Pakken &amp; Loafers</h1>
    <button type="button" id="clear-cart-btn" class="icon-btn" aria-label="Winkelwagen legen">🗑️</button>
  </header>

  <main class="container">
    <a href="index.html" class="back-link">Ga naar productoverzicht</a>

    <table class="cart-table">
      <thead>
        <tr>
          <th>Product</th>
          <th>Aantal</th>
          <th>Prijs</th>
          <th>Subtotaal</th>
        </tr>
      </thead>
      <tbody id="cart-items"></tbody>
    </table>

    <div id="empty-cart-message" class="empty-message" hidden>
      Je winkelwagen is leeg.
    </div>

    <div class="cart-total-row">
      <span>Totaal</span>
      <span id="cart-total">€ 0,00</span>
    </div>

    <button type="button" id="checkout-btn" class="primary-btn full-width">Afrekenen</button>
  </main>

  <script type="module" src="js/cart-page.js"></script>
</body>
</html>
